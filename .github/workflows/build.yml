name: APK bauen

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Projekt vorbereiten
        run: |
          mkdir www && cp index.html www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npm install -D @capacitor/cli@6
          echo '{"appId":"de.halbmarathon.app","appName":"Halbmarathon","webDir":"www"}' > capacitor.config.json
          npx cap add android
          python3 -c "import PIL" 2>/dev/null || pip install --break-system-packages pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          def draw(size, safe):
              im = Image.new("RGBA", (size, size), (0, 0, 0, 255))
              d = ImageDraw.Draw(im)
              m = size * (1 - safe) / 2
              x0, x1, cy = m, size - m, size / 2
              w = x1 - x0
              th = size * 0.075
              d.rectangle([x0, cy - th / 2, x0 + w * 0.7, cy + th / 2], fill="white")
              d.rectangle([x0 + w * 0.7, cy - th / 6, x1, cy + th / 6], fill="white")
              for k in (0, 5, 10, 15, 20):
                  x = x0 + w * k / 21.1
                  d.rectangle([x - size * 0.007, cy + th * 0.9, x + size * 0.007, cy + th * 1.9], fill="white")
              d.rectangle([x1 - size * 0.014, cy - size * 0.2, x1 + size * 0.014, cy + th * 1.9], fill="white")
              return im
          res = "android/app/src/main/res"
          for name, (leg, fg) in {"mdpi": (48, 108), "hdpi": (72, 162), "xhdpi": (96, 216), "xxhdpi": (144, 324), "xxxhdpi": (192, 432)}.items():
              d = f"{res}/mipmap-{name}"
              draw(fg, 0.56).save(f"{d}/ic_launcher_foreground.png")
              sq = draw(leg * 4, 0.74).resize((leg, leg), Image.LANCZOS)
              sq.save(f"{d}/ic_launcher.png")
              mask = Image.new("L", (leg * 4, leg * 4), 0)
              ImageDraw.Draw(mask).ellipse([0, 0, leg * 4 - 1, leg * 4 - 1], fill=255)
              rd = draw(leg * 4, 0.62); rd.putalpha(mask)
              rd.resize((leg, leg), Image.LANCZOS).save(f"{d}/ic_launcher_round.png")
          open(f"{res}/values/ic_launcher_background.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n')
          PY
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n versionCode android/app/build.gradle

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

