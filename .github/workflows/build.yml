      - name: An Release anhängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" halbmarathon.apk --clobber

      - name: Als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: halbmarathon-apk
          path: halbmarathon.apk
