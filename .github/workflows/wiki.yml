name: Publish wiki

# The wiki pages live in this repository under docs/wiki/ and are changed through pull requests.
# This workflow mirrors them to the GitHub wiki. Direct edits in the wiki are overwritten.
# Requirement: the wiki exists. Create the first page once in the "Wiki" tab (any content).

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal links
        run: |
          python3 - <<'PY'
          import os, re, sys
          d = "docs/wiki"
          pages = {f[:-3] for f in os.listdir(d) if f.endswith(".md")}
          bad = []
          for f in sorted(os.listdir(d)):
              if not f.endswith(".md"): continue
              for m in re.finditer(r"\[\[([^\]|]+)(?:\|([^\]]+))?\]\]", open(os.path.join(d, f), encoding="utf8").read()):
                  target = (m.group(2) or m.group(1)).strip()
                  if target != "Home" and target not in pages:
                      bad.append(f"{f}: [[{m.group(0)[2:-2]}]] -> {target}")
          if bad:
              print("Unknown wiki pages:\n" + "\n".join(bad)); sys.exit(1)
          print(f"{len(pages)} pages, all internal links ok")
          PY

      - name: Fetch wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki; then
            echo "::error::The wiki does not exist yet. Create the first page once in the 'Wiki' tab (any content), then run this workflow again."
            exit 1
          fi

      - name: Copy pages
        run: |
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r docs/wiki/. wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to the wiki."; exit 0; fi
          git commit -m "Wiki from docs/wiki (${GITHUB_SHA::7})"
          git push
